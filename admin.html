<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at 10% 10%, rgba(131, 56, 236, 0.08), transparent 30%), #f7f7fb;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .badge-pass {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      background: #dcfce7;
      color: #166534;
      font-weight: 700;
      font-size: 12px;
    }
    .badge-fail {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      background: #fee2e2;
      color: #991b1b;
      font-weight: 700;
      font-size: 12px;
    }
    .badge-dept {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      background: #f3e8ff;
      color: #6b21a8;
      font-weight: 600;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="container">
    <section id="loginCard" class="card small-card">
      <h1>Admin Login</h1>
      <input id="adminPassword" type="password" placeholder="Admin password">
      <button id="loginBtn" class="btn primary">Login</button>
      <p id="adminMessage" class="message"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="test-header">
        <div>
          <h1>Results Dashboard</h1>
          <p class="muted" id="resultsCount">Loading submissions...</p>
        </div>
        <button id="exportBtn" class="btn secondary">Export CSV</button>
      </div>

      <section class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Mobile / ID</th>
              <th>Department</th>
              <th>Email</th>
              <th>Score</th>
              <th>Percentage</th>
              <th>Status</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </section>
    </section>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
